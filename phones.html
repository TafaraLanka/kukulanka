<body data-page="list">
  <a class="skip-link" href="#main">Skip to products</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html" aria-label="KukuLanka home">Kuku<span>Lanka</span></a>
      <form class="header-search" data-search-form role="search">
        <span class="search-icon" aria-hidden="true"></span>
        <label class="sr-only" for="catalogue-search">Search phones</label>
        <input id="catalogue-search" name="q" type="search" autocomplete="off" placeholder="Search phones...">
      </form>
    </div>
  </header>

  <main id="main" class="catalogue-shell">
    <aside class="brand-sidebar" aria-label="Phone brands">
      <button class="brand-side-button" type="button" data-all-devices>All devices <span>›</span></button>
      <button class="brand-side-button" type="button" data-brand="Apple">iPhone <span>›</span></button>
      <button class="brand-side-button" type="button" data-brand="Samsung">Samsung <span>›</span></button>
      <button class="brand-side-button" type="button" data-brand="Xiaomi Redmi">Xiaomi Redmi <span>›</span></button>
    </aside>

    <section class="catalogue-main">
      <div class="mobile-brand-tabs" aria-label="Phone brands">
        <button class="mobile-brand-tab" type="button" data-all-devices>All devices</button>
        <button class="mobile-brand-tab" type="button" data-brand="Apple">iPhone</button>
        <button class="mobile-brand-tab" type="button" data-brand="Samsung">Samsung</button>
        <button class="mobile-brand-tab" type="button" data-brand="Xiaomi Redmi">Xiaomi Redmi</button>
      </div>

      <div id="series-tabs" class="series-tabs" aria-label="Phone series"></div>

      <div class="catalogue-controls" aria-label="Catalogue controls">
        <button class="control-button" id="price-sort" type="button">Price <span class="sort-mark" aria-hidden="true">↕</span></button>
        <button class="control-button" id="model-button" type="button">Model <span class="model-mark" aria-hidden="true">☷</span></button>
        <button class="control-button" id="filter-button" type="button">Filter <span class="filter-icon" aria-hidden="true"></span><span id="filter-count" class="filter-count" hidden></span></button>
      </div>

      <div class="results-meta"><span id="result-count">0 phones</span></div>
      <div id="phone-results" class="phone-results" aria-live="polite"></div>
    </section>
  </main>

  <div class="modal-layer" id="model-modal" hidden>
    <button class="modal-scrim" type="button" data-close-modal="model-modal" aria-label="Close model selector"></button>
    <section class="sheet model-sheet" role="dialog" aria-modal="true" aria-labelledby="model-sheet-title">
      <div class="sheet-header"><h2 id="model-sheet-title">Choose Model</h2><button class="sheet-close" type="button" data-close-modal="model-modal" aria-label="Close">×</button></div>
      <div class="model-sheet-grid">
        <nav class="model-brand-nav" aria-label="Brands">
          <button type="button" data-model-brand="Apple">iPhone</button>
          <button type="button" data-model-brand="Samsung">Samsung</button>
          <button type="button" data-model-brand="Xiaomi Redmi">Xiaomi Redmi</button>
        </nav>
        <div id="model-sheet-content" class="model-sheet-content"></div>
      </div>
    </section>
  </div>

  <div class="modal-layer" id="filter-modal" hidden>
    <button class="modal-scrim" type="button" data-close-modal="filter-modal" aria-label="Close filters"></button>
    <section class="sheet filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title">
      <div class="sheet-header"><h2 id="filter-sheet-title">Filter</h2><button class="sheet-close" type="button" data-close-modal="filter-modal" aria-label="Close">×</button></div>
      <div class="filter-layout">
        <nav class="filter-nav" aria-label="Filter sections">
          <button class="is-active" type="button" data-filter-section="storage">Storage</button>
          <button type="button" data-filter-section="battery">Battery Health</button>
        </nav>
        <div class="filter-content">
          <section class="filter-panel is-active" data-filter-panel="storage">
            <h3>Storage</h3>
            <div id="storage-options" class="option-grid"></div>
          </section>
          <section class="filter-panel" data-filter-panel="battery">
            <h3>Battery Health</h3>
            <div class="option-grid">
              <button type="button" data-battery="100">100%</button>
              <button type="button" data-battery="95">95% and above</button>
              <button type="button" data-battery="90">90% and above</button>
            </div>
          </section>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="secondary-action" id="reset-filters" type="button">Reset</button>
        <button class="primary-action" id="apply-filters" type="button">Apply</button>
      </div>
    </section>
  </div>

  <script src="js/config.js?v=20261018"></script>
  <script src="js/phones.js?v=20261018"></script>
  <script src="js/main.js?v=20261018"></script>
</body>
</html>
